services:
  - type: web
    name: texomaha
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TEXOMAHA_JWT_SECRET
        generateValue: true
      - key: TEXOMAHA_DATA_DIR
        value: /var/data
    disk:
      name: texomaha-data
      mountPath: /var/data
      sizeGB: 1
